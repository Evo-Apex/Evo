# Evo 赛事数据的协作网页（Cloudflare Worker），说明见 worker.js。部署：cd server/team && wrangler deploy
name = "evo-team"
main = "worker.js"
compatibility_date = "2026-06-01"
workers_dev = false  # 只用自己的域名（国内连不上 workers.dev）
preview_urls = false

routes = [
  { pattern = "team.evotracker.cn", custom_domain = true },
]

# 定时任务：每分钟从 Liquipedia 抓一步（每次最多 1 个请求，一小时最多 50 次，见 lpsync.js；2026-11-25 换成专用的 Key
# 以前是每 3 分钟、一小时最多 20 次）。「数据」页的统计照旧每 3 分钟看一次（worker.js 的 scheduled）
[triggers]
crons = ["* * * * *"]

# 成员和以后的赛事数据都存在这个不公开的存储桶里（不是放安装包的 evotracker，那个是公开的）
[[r2_buckets]]
binding = "DATA"
bucket_name = "evo-team"

# 放安装包的公开存储桶（https://dl.evotracker.cn/）：发布时写 esports.json、esports_test.json 这两个文件，别的一律不碰（publish.js）
[[r2_buckets]]
binding = "PUBLIC"
bucket_name = "evotracker"

# 匿名统计的数据库（统计服务器 server/stats/ 往里写）：「数据」页的数从这里算（statsroll.js，只有 SELECT；
# Cloudflare 的绑定不能设成只读）。D1 的免费额度整个账号共用，所以每 3 小时增量算一次，页面打开时不读它
[[d1_databases]]
binding = "STATS"
database_name = "evo-stats"
database_id = "909dfd16-857d-45fa-96cd-bc828da97e29"

[observability]
enabled = false  # 不记请求日志（里面会有 IP 地址）
